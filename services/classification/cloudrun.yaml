apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lekana-classification
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '10'
        autoscaling.knative.dev/minScale: '0'
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: PROJECT_NUMBER-compute@developer.gserviceaccount.com
      containers:
      - name: lekana-classification
        image: gcr.io/PROJECT_ID/lekana-classification:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: NODE_ENV
          value: production
        - name: SERVICE_VERSION
          value: "1.0.0"
        - name: PORT
          value: "8080"
        - name: DEFAULT_CONFIDENCE_THRESHOLD
          value: "0.7"
        - name: CATEGORY_SIMILARITY_THRESHOLD
          value: "0.85"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-uri
              key: latest
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: latest
        - name: GOOGLE_CLOUD_PROJECT
          value: PROJECT_ID
        - name: GOOGLE_CLOUD_LOCATION
          value: us
        - name: DOCUMENT_AI_PROCESSOR_ID
          value: PROCESSOR_ID
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 0
          timeoutSeconds: 1
          periodSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 1
          periodSeconds: 10
          failureThreshold: 3
