# Local development override: exposes the databases on localhost so services
# started with `npm run dev` can reach them.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres mongo
services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  mongo:
    ports: ["127.0.0.1:27017:27017"]
