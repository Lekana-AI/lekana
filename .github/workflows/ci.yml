name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - apps/web
          - services/workflow-builder
          - services/runtime
          - services/upload
          - services/classification
          - services/ocr
          - services/db-export
          - services/conditional-router
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        if: hashFiles(format('{0}/prisma/schema.prisma', matrix.package)) != ''
        run: npx prisma generate
      - name: Build
        run: npm run build --if-present
        env:
          SVELTE_ADAPTER: node
          PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          PUBLIC_API_URL: http://localhost:3002
          PUBLIC_YOUTUBE_TUTORIAL_URL: ""
      - name: Docker image builds
        run: docker build -q -t lekana-ci .

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
